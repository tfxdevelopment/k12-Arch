trigger:
  - main  

variables:
  - group: DatabaseCredentials  # must contain DB_SERVER and DB_NAME

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: UseNode@1
    inputs:
      version: '20.x'
    displayName: 'Use Node.js 20.x'

  - script: |
      npm init -y
      npm install @faker-js/faker mssql @azure/identity@^3.2.0
    displayName: 'Install dependencies'
    workingDirectory: terraform/modules/api-enrollment/CFIK12.Database/DB_Hydration

  - script: |
      node terraform/modules/api-enrollment/CFIK12.Database/DB_Hydration/generate.mjs
    displayName: 'Run Faker Script and Insert Data into Azure SQL'
    env:
      DB_SERVER: $(DB_SERVER)
      DB_NAME: $(DB_NAME)
      AZURE_CLIENT_ID: 71619381-c5a4-4269-b4fc-ec711ba40fac
      AZURE_TENANT_ID: 3f80a41f-c452-4071-a415-4df4176730e2
      FEDERATED_TOKEN_FILE: /var/run/secrets/azure/tokens/azure-identity-token

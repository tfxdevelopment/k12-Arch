trigger:
  - main

variables:
  - group: DatabaseCredentials

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: UseNode@1
    inputs:
      version: '20.x'
    displayName: 'Use Node.js'

  - task: AzureCLI@2
    displayName: 'Run Faker Script and Insert Data into Azure SQL'
    inputs:
      azureSubscription: 'k12-development'  # Must be federated connection
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        npm install @faker-js/faker mssql
        node generate.mjs
      workingDirectory: 'terraform/modules/api-enrollment/CFIK12.Database/DB_Hydration'
    env:
      DB_SERVER: $(DB_SERVER)
      DB_NAME: $(DB_NAME)

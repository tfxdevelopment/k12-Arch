apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-config
spec:
  tracing:
    samplingRate: "1"
    otel:
      endpointAddress: "localhost:4318"
      isSecure: false
      protocol: http

  metrics:
    enabled: true

  logging:
    apiLogging:
      enabled: true
      obfuscateURLs: false

  # Access Control for service-to-service communication
  accessControl:
    defaultAction: allow
    trustDomain: "public"
    policies:
      - appId: enrollment-api
        defaultAction: allow
        operations:
          - name: "*"
            httpVerb: ["*"]
            action: allow

      - appId: programs-api
        defaultAction: allow
        operations:
          - name: "*"
            httpVerb: ["*"]
            action: allow

      - appId: admin-api
        defaultAction: allow
        operations:
          - name: "*"
            httpVerb: ["*"]
            action: allow

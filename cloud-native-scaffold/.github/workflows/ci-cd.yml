name: K12 Cloud Native CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ============================================================================
  # BUILD JOB
  # ============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore K12.CloudNative.sln
        working-directory: ./cloud-native-scaffold

      - name: Build solution
        run: dotnet build K12.CloudNative.sln --no-restore --configuration Release
        working-directory: ./cloud-native-scaffold

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            ./cloud-native-scaffold/**/bin/Release
          retention-days: 7

  # ============================================================================
  # TEST JOB
  # ============================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore K12.CloudNative.sln
        working-directory: ./cloud-native-scaffold

      - name: Run tests
        run: |
          echo "No test projects configured yet"
          # dotnet test K12.CloudNative.sln --no-restore --verbosity normal --collect:"XPlat Code Coverage"

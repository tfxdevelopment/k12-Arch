openapi: 3.0.1
info:
  title: dev-api-enrollment
  description: K12 APIs
  version: '1.0'
servers:
  - url: http://localhost:59814/api
paths:
  /household/details:
    get:
      tags:
        - HouseholdDetails
      operationId: GetHouseholdDetails
      responses:
        '200':
          description: The OK response message containing a JSON result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/householdDetailsDto'
        '500':
          description: Internal server error
  /household/householdInfo:
    put:
      tags:
        - HouseholdDetails
      operationId: UpdateHouseHoldInfo
      responses:
        '200':
          description: The OK response message containing a JSON result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/householdInfoUpdateViewModel'
        '500':
          description: Internal server error
  /household/studentInfo:
    put:
      tags:
        - HouseholdDetails
      operationId: UpdateStudentInfo
      responses:
        '200':
          description: The OK response message containing a JSON result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/studentInfoUpdateViewModel'
        '500':
          description: Internal server error
  /household/students:
    get:
      tags:
        - HouseholdStudents
      operationId: GetHouseholdStudents
      parameters:
        - name: householdId
          in: query
          description: The ID of the household to find the students of.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The OK response message containing a JSON result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/householdStudentsDto'
        '500':
          description: Internal server error
  '/household/student/{studentId}':
    get:
      tags:
        - HouseholdStudents
      operationId: GetHouseholdStudentById
      parameters:
        - name: studentId
          in: path
          description: The ID of the Student.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The OK response message containing a JSON result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/householdStudentsDto'
        '400':
          description: Bad request due to invalid Student ID.
        '500':
          description: Internal server error
  /pandadoc/webhook:
    post:
      tags:
        - DetectPandaDocEvent
      operationId: DetectPandaDocEvent
      parameters:
        - name: signature
          in: query
          description: PandaDoc's Webhook Signature.
          required: true
          schema:
            type: string
      responses:
        '202':
          description: PandaDoc Event Recorded Successfully from the Web Hook.
        '400':
          description: 'Bad Request: PandaDoc API Signature/Format was Incorrect.'
        '401':
          description: 'Unauthorized: PandaDoc Event API Request Denied.'
        '500':
          description: 'Internal Error: PandaDoc WebHook Event Failed.'
  /PandaDoc/templates:
    get:
      tags:
        - GetAllPandaDocTemplates
      operationId: GetAllPandaDocTemplates
      responses:
        '200':
          description: The OK response message containing a JSON result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/pandaDocTemplatesListDto'
        '500':
          description: Internal server error
  /PandaDoc/Recipients:
    get:
      tags:
        - GetAllPandaDocRecipients
      operationId: GetAllPandaDocRecipients
      responses:
        '200':
          description: The OK response message containing a JSON result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/pandaDocRecipientListDto'
        '500':
          description: Internal server error
  /PandaDoc/RecipientsToSend:
    get:
      tags:
        - GetAllPandaDocRecipients
      operationId: GetAllPandaDocRecipientsToSend
      parameters:
        - name: programPartnerTypeId
          in: query
          description: Filter by Program Partner Type ID.
          schema:
            type: integer
            format: int32
            nullable: true
        - name: searchTerm
          in: query
          description: Search term to filter recipients to send.
          schema:
            type: string
        - name: templateId
          in: query
          description: Search by if template not sent to or not.
          schema:
            enum:
              - 1
              - 2
              - 3
            type: integer
            format: int32
            default: 1
      responses:
        '200':
          description: The OK response message containing a JSON result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/sendToRecipientDto'
        '500':
          description: Internal server error
  /senddocuments/household:
    post:
      tags:
        - SendDocumentToHouseHolds
      operationId: SendDocumentToHouseHolds
      responses:
        '202':
          description: The OK response message containing a JSON result.
        '500':
          description: Internal server error
  '/enrollment/{token}/newenrollment':
    get:
      tags:
        - Enrollment
      operationId: NewEnrollment
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The enrollment session details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/newEnrollmentSessionViewModel'
        '400':
          description: Bad request due to invalid token.
        '500':
          description: Internal server error.
  /enrollment/PromptFileUpload:
    post:
      tags:
        - Enrollment
      operationId: SubmitPromptFileUpload
      responses:
        '200':
          description: The file upload result details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jsonResult'
        '400':
          description: Bad request due to invalid data.
        '500':
          description: Internal server error.
  /enrollment/GetPromptFileUpload:
    post:
      tags:
        - Enrollment
      operationId: GetPromptFileUpload
      responses:
        '200':
          description: The file was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jsonResult'
        '400':
          description: Bad request due to invalid data.
        '500':
          description: Internal server error.
  '/enrollment/{sessionId}/prompt':
    post:
      tags:
        - Enrollment
      operationId: SubmitPromptData
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: The prompt data being submitted.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/submitPromptDataViewModel'
        required: true
      responses:
        '200':
          description: The enrollment session details after submitting the prompt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/enrollmentSessionViewModel'
        '400':
          description: Bad request due to integrity check errors.
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Internal server error.
  '/enrollment/{sessionId}/enrollmentsession':
    get:
      tags:
        - Enrollment
      operationId: GetEnrollmentSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The details of the enrollment session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getEnrollmentSessionViewModel'
        '400':
          description: Invalid sessionId provided.
        '500':
          description: Internal server error.
  '/enrollment/{sessionId}/prompt/{promptToken}':
    get:
      tags:
        - Enrollment
      operationId: GetEnrollmentSessionPrompt
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: promptToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: An enrollment session prompt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/promptViewModel'
        '400':
          description: Invalid parameters
        '500':
          description: Internal server error.
  '/enrollment/{sessionId}/finalprompt':
    get:
      tags:
        - enrollment
      operationId: GetFinalPrompt
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The final review data for the enrollment session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/finalReviewViewModel'
        '400':
          description: Bad request due to invalid session.
        '404':
          description: Session not found
        '500':
          description: Internal server error.
  '/enrollment/{sessionId}/submitEnrollment':
    get:
      tags:
        - enrollment
      operationId: SubmitCompletedEnrollment
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully submitted the completed enrollment.
        '400':
          description: Bad request due to invalid session ID or token.
        '500':
          description: Internal server error.
  '/history/{id}':
    get:
      tags:
        - History
      operationId: GetDetailedHistory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The detailed history for the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getHistoryDetailViewModel'
        '404':
          description: Internal server error
  /history/note:
    post:
      tags:
        - History
      operationId: AddHistoryNote
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/historyNoteCreateViewModel'
      responses:
        '201':
          description: Payload of HistoryNoteViewModel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/historyNoteViewModel'
        '500':
          description: Internal server error
    put:
      tags:
        - History
      operationId: UpdateHistoryNote
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/historyNoteUpdateViewModel'
      responses:
        '200':
          description: Payload of HistoryNoteViewModel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/historyNoteViewModel'
        '404':
          description: HistoryNote not found
        '500':
          description: Internal server error
  '/history/note/{noteId}':
    get:
      tags:
        - History
      operationId: GetHistoryNoteById
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payload of HistoryNoteViewModel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/historyNoteViewModel'
        '404':
          description: Note not found
        '500':
          description: Internal server error
  '/history/{historyId}/notes':
    get:
      tags:
        - HistoryNote
      operationId: GetNotesByHistoryId
      parameters:
        - name: historyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payload of GetNotesByHistoryIdViewModel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getNotesByHistoryIdViewModel'
        '404':
          description: No notes found for the provided history ID
        '500':
          description: Internal server error
  '/history/notes/{programToken}':
    get:
      tags:
        - History
      operationId: GetHistoryByProgramTokenAsync
      parameters:
        - name: programToken
          in: path
          description: The token of the program
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payload of GetHistoryByTokenViewModel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getHistoryByTokenViewModel'
        '404':
          description: No history found for the provided program token
        '500':
          description: Internal server error
  /enrollment/programs:
    get:
      tags:
        - Programs
      operationId: GetAllPrograms
      responses:
        '200':
          description: The OK response message containing a JSON result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getAllEnrollmentProgramsViewModel'
        '500':
          description: Internal server error
  '/enrollment/programs/{token}':
    get:
      tags:
        - Programs
      operationId: GetProgramByToken
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The OK response message containing a JSON result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/enrollmentProgramViewModel'
        '404':
          description: Program not found for the given token
        '500':
          description: Internal server error
  '/enrollment/programs3/{token}':
    delete:
      tags:
        - Programs
      operationId: DeleteProgram
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Returns No Content result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/void'
        '404':
          description: Program not found
        '422':
          description: Cannot delete Program when there is an active session
        '500':
          description: Internal server error
  /enrollment/programs/datatypes:
    get:
      tags:
        - Programs
      operationId: GetAllDatatypes
      responses:
        '200':
          description: The OK response contains the valid DataTypes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/allTypesViewModel'
  /enrollment/programs/componenttypes:
    get:
      tags:
        - Programs
      operationId: GetAllComponentTypes
      responses:
        '200':
          description: The OK response contains the valid ComponentTypes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/allTypesViewModel'
  /enrollment/programs/inputtypes:
    get:
      tags:
        - Programs
      operationId: GetAllInputTypes
      responses:
        '200':
          description: The OK response contains the valid InputTypes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/allTypesViewModel'
  /enrollment/programs/ping:
    get:
      tags:
        - Programs
      operationId: GetPing
      responses:
        '200':
          description: The OK response contains the API version
          content:
            application/json:
              schema:
                type: string
  /enrollment/programs2:
    post:
      tags:
        - Programs
      operationId: AddProgram
      requestBody:
        description: Enrollment Program Create model
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/enrollmentProgramCreateViewModel'
      responses:
        '201':
          description: The Created response message containing Location URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/void'
        '400':
          description: Invalid request due to validation errors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/validationResult'
        '500':
          description: Internal server error
  '/enrollment/programs2/{programToken}':
    put:
      tags:
        - Programs
      operationId: UpdateProgram
      parameters:
        - name: programToken
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Enrollment Program Update model
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/enrollmentProgramUpdateViewModel'
      responses:
        '204':
          description: Empty response
        '500':
          description: Internal server error
  '/enrollment/programs/{programToken}/prompts':
    post:
      tags:
        - Prompt
      operationId: AddPrompt
      parameters:
        - name: programToken
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Input Enrollment prompts model
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/promptCreateViewModel'
      responses:
        '201':
          description: The Created response message containing Location URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/void'
        '400':
          description: Invalid request due to validation errors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/validationResult'
        '500':
          description: Internal server error
  /enrollment/prompts:
    put:
      tags:
        - Prompt
      operationId: UpdatePrompt
      requestBody:
        description: Input Enrollment prompts model
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/promptUpdateViewModel'
      responses:
        '201':
          description: The Created response message containing Location URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/void'
        '400':
          description: Invalid request due to validation errors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/validationResult'
        '500':
          description: Internal server error
  '/enrollment/programs/{programToken}/prompts/{promptToken}':
    delete:
      tags:
        - Prompt
      operationId: DeletePrompt
      parameters:
        - name: programToken
          in: path
          required: true
          schema:
            type: string
        - name: promptToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Returns No Content result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/void'
        '404':
          description: Prompt not found
        '500':
          description: Internal server error
    get:
      tags:
        - Prompt
      operationId: GetPromptByPromptToken
      parameters:
        - name: programToken
          in: path
          required: true
          schema:
            type: string
        - name: promptToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The OK response message containing a JSON result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/promptViewModel'
        '404':
          description: Prompt not found for the given token
        '500':
          description: Internal server error
  '/enrollment/programs/{programToken}/prompts/{promptToken}/promptComponents/{promptComponentToken}':
    delete:
      tags:
        - PromptComponent
      operationId: DeletePromptComponent
      parameters:
        - name: programToken
          in: path
          required: true
          schema:
            type: string
        - name: promptToken
          in: path
          required: true
          schema:
            type: string
        - name: promptComponentToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Returns No Content result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/void'
        '404':
          description: Prompt Component not found
        '500':
          description: Internal server error
  '/enrollment/programs/{programToken}/prompts/{promptToken}/promptComponents':
    post:
      tags:
        - PromptComponent
      operationId: AddPromptComponent
      parameters:
        - name: programToken
          in: path
          required: true
          schema:
            type: string
        - name: promptToken
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Input Enrollment prompt component model
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/promptComponentCreateViewModel'
      responses:
        '201':
          description: The Created response message containing Location URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/void'
        '400':
          description: Invalid request due to validation errors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/validationResult'
        '500':
          description: Internal server error
  '/enrollment/programs/{programToken}/tree':
    get:
      tags:
        - Prompt
      operationId: GetPromptTree
      parameters:
        - name: programToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The OK response message containing the prompt Tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/promptTreeResponseViewModel'
        '404':
          description: Program not found for the given token
        '500':
          description: Internal server error
  '/enrollment/programs/{token}/deactivate':
    post:
      tags:
        - Programs
      operationId: DeactivateProgramAsync
      parameters:
        - name: token
          in: path
          description: The token of the program to deactivate.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Program successfully deactivated.
        '404':
          description: Program not found.
        '500':
          description: Internal server error.
  /enrollment/programs/publish:
    put:
      tags:
        - EnrollmentProgram
      operationId: PublishEnrollmentProgram
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publishEnrollmentProgramViewModel'
      responses:
        '200':
          description: Payload of HistoryNoteViewModel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/historyNoteViewModel'
        '404':
          description: Enrollment Program not found
        '500':
          description: Internal server error
  /agreements:
    get:
      tags:
        - Agreements
      operationId: GetAllAgreements
      responses:
        '200':
          description: List of agreements.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/agreementDto'
        '400':
          description: Invalid request.
    post:
      tags:
        - Agreements
      operationId: CreateAgreement
      requestBody:
        description: The agreement to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agreementDto'
      responses:
        '201':
          description: Agreement created successfully.
        '400':
          description: Invalid agreement data.
    put:
      tags:
        - Agreements
      operationId: UpdateAgreement
      requestBody:
        description: The agreement to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agreementDto'
      responses:
        '204':
          description: Agreement updated successfully.
        '400':
          description: Invalid agreement data.
  '/agreements/{agreementId}':
    get:
      tags:
        - Agreements
      operationId: GetAgreementById
      parameters:
        - name: agreementId
          in: path
          description: The ID of the agreement to retrieve.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The agreement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agreementDto'
        '404':
          description: Agreement not found.
  '/agreements/{agreementId}/currentuser/accepted':
    get:
      tags:
        - Agreements
      operationId: HasCurrentUserAcceptedAgreement
      parameters:
        - name: agreementId
          in: path
          description: The ID of the agreement.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Whether the user has accepted the agreement.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request.
  '/agreements/{agreementId}/user/{accountId}/accepted':
    get:
      tags:
        - Agreements
      operationId: HasUserAcceptedAgreement
      parameters:
        - name: agreementId
          in: path
          description: The ID of the agreement.
          required: true
          schema:
            type: string
        - name: accountId
          in: path
          description: The ID of the account to check.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Whether the user has accepted the agreement.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request.
  /agreements/accept:
    post:
      tags:
        - Agreements
      operationId: AcceptAgreement
      requestBody:
        description: The agreement model to accept.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/acceptAgreementModel'
      responses:
        '204':
          description: Agreement accepted successfully.
        '400':
          description: Invalid request.
  '/awards/generatelottery/{programTypeId}/{lotterySettingsId}':
    get:
      tags:
        - Awards
      operationId: GenerateLottery
      parameters:
        - name: programTypeId
          in: path
          description: Program Type Id.
          required: true
          schema:
            type: integer
            format: int32
        - name: lotterySettingsId
          in: path
          description: lottery setting Id of the academic period.
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The OK response message containing the count of successfull updates to the students' lottery column.
          content:
            application/json:
              schema:
                type: integer
                format: int32
        '400':
